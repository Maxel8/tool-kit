<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff0000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="../icon.png" type="image/png" />
    <link rel="stylesheet" href="../css/style.css" />

    <title>Tool-Kit</title>
  </head>

  <body>
    <header class="header">
      <a href="../index.html" class="header-content">
        <img src="../icon.png" alt="Logo" class="logo" />
        <span class="title">Tool-Kit</span>
      </a>
    </header>

    <main class="page">
      <section class="card">
        <h1>Speicherfüllung (Entleerung)</h1>

        <div class="form">
          <label for="capacity"> Speicherkapazität (in kWh) </label>

          <input id="capacity" value="11000" type="number" />

          <label for="battery"> Aktueller Batteriestand (in %) </label>

          <input id="battery" type="number" />

          <label for="lose"> Aktuelle Speicherentleerung (in kWh) </label>

          <input id="lose" type="number" />

          <button onclick="berechnen()">Berechnen</button>

          <br />

          <p>Ergebnis:</p>

          <p>
            ➡️ Der Speicher ist bei 0% in
            <span id="hour">XX</span>h und <span id="minutes">XX</span>min
          </p>

          <p>
            Daher ist der Speicher um <span id="time">XX:XX</span> Uhr leer!
          </p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>© 2026 Tool-Kit • Entwickelt von Maximilian</p>
    </footer>

    <script>
      function berechnen() {
        const k = Number(document.getElementById("capacity").value);
        const b = Number(document.getElementById("battery").value);
        const l = Number(document.getElementById("lose").value);

        if (!capacity || capacity <= 0) {
          alert("Bitte geben Sie eine gültige Speicherkapazität ein.");
          return;
        }

        if (battery < 0 || battery > 100) {
          alert(
            "Bitte geben Sie einen Batteriestand zwischen 0 und 100 % ein.",
          );
          return;
        }

        if (lose <= 0) {
          alert("Bitte geben Sie eine gültige Speicherzufuhr ein.");
          return;
        }

        const time = (k * b) / 100 / l;

        const hour = Math.floor(time);
        const minutes = Math.floor((time - hour) * 60);

        const jetzt = new Date();
        const leerTime = new Date(jetzt.getTime() + time * 60 * 60 * 1000);

        const output = leerTime.toLocaleTimeString("de-DE", {
          hour: "2-digit",
          minute: "2-digit",
        });

        document.getElementById("hour").textContent = hour;
        document.getElementById("minutes").textContent = minutes;
        document.getElementById("time").textContent = output;
      }
    </script>
  </body>
</html>
